services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////srv/data/stress_app.db
      - CHROMA_PERSIST_DIR=/srv/data/chroma
      - KNOWLEDGE_DIR=/srv/data/knowledge
      # Mount a local fine-tuned model into /srv/models/phobert-stress to enable it.
      - PHOBERT_STRESS_MODEL_DIR=/srv/models/phobert-stress
    volumes:
      - app-data:/srv/data
      - ./data/knowledge:/srv/data/knowledge:ro
      - ./models:/srv/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: streamlit run streamlit_app/Home.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  app-data:
