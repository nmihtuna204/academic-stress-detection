name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Pinned: an unpinned linter changes its own rules under you.
          # See [tool.ruff.lint] select in pyproject.toml.
          pip install -r requirements.txt ruff==0.15.22

      - name: Lint (ruff)
        run: ruff check app/ scripts/ streamlit_app/ tests/

      - name: Tests (network-dependent tests excluded)
        # requires_network tests download HF models; LLM tests are mocked and
        # need no OPENAI_API_KEY. HF_HUB_OFFLINE hard-blocks accidental downloads.
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest tests/ -q -m "not requires_network"
