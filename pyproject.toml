[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "requires_network: needs internet (model downloads); skipped in CI",
]

[tool.ruff]
line-length = 110
extend-exclude = ["research"]

[tool.ruff.lint]
# Selected explicitly rather than left to ruff's defaults. Those defaults are
# not stable across versions: ruff 0.16 added the isort group (I) to them, so
# a CI job that installed the latest ruff started failing on code that passed
# locally under 0.15 with no source change in between. Naming the rules makes
# the check mean the same thing on both machines and on any future version.
select = ["E4", "E7", "E9", "F", "I"]
# E501: long lines occur in string content; line-length is advisory there.
ignore = ["E501"]
